<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    /* ==============================================
       1. PANTALLA PRINCIPAL
       ============================================== */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      transition: background-color 0.8s ease;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body.modo-noche {
      background-color: #05070f;
    }

    /* ==============================================
       2. ESTRUCTURA Y MARCO DEL INTERRUPTOR
       ============================================== */
    .switch {
      position: relative;
      display: inline-block;
      width: 200px;
      height: 90px;
      cursor: pointer;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 90px;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 0 30px rgba(56, 189, 248, 0.6),
        0 15px 35px rgba(0, 0, 0, 0.25),
        inset 0 6px 15px rgba(0, 0, 0, 0.4),
        inset 0 -3px 8px rgba(255, 255, 255, 0.9);
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Cristal frontal */
    .slider::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(
        135deg, 
        rgba(255,255,255,0.4) 0%, 
        rgba(255,255,255,0.08) 42%, 
        transparent 50%
      );
      pointer-events: none;
      z-index: 20;
    }

    /* ==============================================
       3. FONDO DE DÍA (Sky Ultra Detail)
       ============================================== */
    .sky-day, .sky-night {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      transition: opacity 0.8s ease;
    }

    .sky-day {
      background: linear-gradient(180deg, #0284c7 0%, #38bdf8 45%, #bae6fd 80%, #e0f2fe 100%);
      opacity: 1;
    }

    /* Rayos solares / Sunbeams */
    .sunbeam {
      position: absolute;
      top: -20px; left: -20px;
      width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,235,59,0.2) 40%, transparent 70%);
      animation: pulse-beam 4s infinite alternate ease-in-out;
      pointer-events: none;
    }

    @keyframes pulse-beam {
      0% { transform: scale(0.9) rotate(0deg); opacity: 0.6; }
      100% { transform: scale(1.15) rotate(10deg); opacity: 0.9; }
    }

    /* Nubes animadas navegando continuamente */
    .clouds-container {
      position: absolute;
      width: 100%; height: 100%;
    }

    .cloud {
      position: absolute;
      background: #ffffff;
      border-radius: 20px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
    }

    .cloud-1 {
      width: 42px; height: 14px; top: 16px; left: 100px;
      animation: float-cloud1 12s linear infinite;
    }
    .cloud-1::before { content:''; position: absolute; width: 18px; height: 18px; background: #ffffff; border-radius: 50%; top: -10px; left: 8px; }
    .cloud-1::after { content:''; position: absolute; width: 14px; height: 14px; background: #ffffff; border-radius: 50%; top: -6px; left: 22px; }

    .cloud-2 {
      width: 30px; height: 11px; top: 34px; left: 140px; opacity: 0.85;
      animation: float-cloud2 18s linear infinite;
    }
    .cloud-2::before { content:''; position: absolute; width: 14px; height: 14px; background: #ffffff; border-radius: 50%; top: -7px; left: 6px; }

    @keyframes float-cloud1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(25px); }
      100% { transform: translateX(0); }
    }

    @keyframes float-cloud2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-20px); }
      100% { transform: translateX(0); }
    }

    /* Pájaros lejanos */
    .bird {
      position: absolute;
      width: 8px; height: 4px;
      border-top: 2px solid rgba(255,255,255,0.85);
      border-left: 2px solid rgba(255,255,255,0.85);
      transform: rotate(45deg);
      top: 22px; left: 85px;
      animation: bird-fly 6s infinite ease-in-out;
    }
    .bird-2 { top: 28px; left: 115px; transform: scale(0.7) rotate(45deg); animation-delay: 2s; }

    @keyframes bird-fly {
      0%, 100% { transform: translateY(0) rotate(45deg); }
      50% { transform: translateY(-3px) rotate(40deg); }
    }

    /* ==============================================
       4. FONDO DE NOCHE (Aurora, Nebulosa, Estrellas)
       ============================================== */
    .sky-night {
      background: linear-gradient(180deg, #030712 0%, #0f172a 40%, #1e1b4b 75%, #2e1065 100%);
      opacity: 0;
    }

    /* Aurora Boreal animada */
    .aurora {
      position: absolute;
      top: -10px; left: 0; width: 100%; height: 50px;
      background: linear-gradient(90deg, transparent, rgba(52, 211, 153, 0.35), rgba(168, 85, 247, 0.4), transparent);
      filter: blur(8px);
      animation: aurora-wave 6s infinite alternate ease-in-out;
    }

    @keyframes aurora-wave {
      0% { transform: skewX(-10deg) scaleY(0.9); opacity: 0.5; }
      100% { transform: skewX(10deg) scaleY(1.3); opacity: 0.95; }
    }

    /* Estrellas múltiples */
    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffffff, 0 0 10px #a5b4fc;
      animation: twinkle 2s infinite alternate ease-in-out;
    }
    .star-1 { width: 3px; height: 3px; top: 12px; left: 20px; animation-delay: 0s; }
    .star-2 { width: 2px; height: 2px; top: 28px; left: 45px; animation-delay: 0.3s; }
    .star-3 { width: 4px; height: 4px; top: 16px; left: 85px; animation-delay: 0.7s; }
    .star-4 { width: 2px; height: 2px; top: 38px; left: 110px; animation-delay: 1.1s; }
    .star-5 { width: 3px; height: 3px; top: 18px; left: 145px; animation-delay: 1.5s; }
    .star-6 { width: 2px; height: 2px; top: 42px; left: 165px; animation-delay: 0.5s; }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.4); }
    }

    /* Estrella Fugaz */
    .shooting-star {
      position: absolute;
      top: 10px; right: 30px;
      width: 40px; height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
      transform: rotate(-35deg);
      opacity: 0;
      animation: shoot 5s infinite ease-in-out 2s;
    }

    @keyframes shoot {
      0% { transform: translate(0, 0) rotate(-35deg); opacity: 1; width: 40px; }
      20% { transform: translate(-80px, 50px) rotate(-35deg); opacity: 0; width: 0px; }
      100% { opacity: 0; }
    }

    /* ==============================================
       5. CAPAS DE TERRENO Y PAISAJE (SVG Detallado)
       ============================================== */
    .terrain {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 45px;
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .terrain-day { opacity: 1; transform: translateY(0); }
    .terrain-night { opacity: 0; transform: translateY(12px); }

    .terrain svg { width: 100%; height: 100%; display: block; }

    /* ==============================================
       6. BOTÓN DESLIZANTE 2D / ESTILO 3D ULTRA BRILLANTE
       ============================================== */
    .knob {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
    }

    /* Sol y Luna */
    .sun-icon, .moon-icon {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 50%;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .sun-icon {
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fff066 22%, #ffb700 55%, #f97316 100%);
      opacity: 1;
      transform: scale(1);
      box-shadow: 
        0 0 25px #ffea00,
        0 0 45px #f97316,
        inset 0 3px 6px rgba(255, 255, 255, 0.95),
        inset 0 -5px 8px rgba(194, 65, 12, 0.6);
    }

    .moon-icon {
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f1f5f9 35%, #cbd5e1 65%, #64748b 100%);
      opacity: 0;
      transform: scale(0.7);
      box-shadow: 
        0 0 25px rgba(255, 255, 255, 0.95),
        0 0 40px rgba(165, 180, 252, 0.9),
        0 0 60px rgba(99, 102, 241, 0.5),
        inset 0 3px 6px rgba(255, 255, 255, 1),
        inset 0 -5px 8px rgba(30, 41, 59, 0.7);
    }

    .crater {
      position: absolute;
      background: #94a3b8;
      border-radius: 50%;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5), 0 0 3px rgba(255,255,255,0.8);
    }
    .crater-1 { width: 16px; height: 16px; top: 16px; left: 20px; }
    .crater-2 { width: 11px; height: 11px; top: 40px; left: 14px; }
    .crater-3 { width: 14px; height: 14px; top: 36px; left: 42px; }

    /* ==============================================
       7. ESTADO ACTIVADO (NOCHE / DERECHA)
       ============================================== */
    input:checked + .slider .knob {
      transform: translateX(110px);
    }

    input:checked + .slider .sun-icon {
      opacity: 0;
      transform: scale(0.7);
    }

    input:checked + .slider .moon-icon {
      opacity: 1;
      transform: scale(1);
    }

    input:checked + .slider {
      border-color: rgba(255, 255, 255, 0.95);
      box-shadow: 
        0 0 35px rgba(129, 140, 248, 0.8),
        0 15px 35px rgba(0, 0, 0, 0.5),
        inset 0 6px 15px rgba(0, 0, 0, 0.6),
        inset 0 -3px 8px rgba(255, 255, 255, 0.6);
    }

    input:checked + .slider .sky-day { opacity: 0; }
    input:checked + .slider .sky-night { opacity: 1; }

    input:checked + .slider .terrain-day {
      opacity: 0;
      transform: translateY(12px);
    }
    input:checked + .slider .terrain-night {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <label class="switch">
    <input type="checkbox" id="interruptor">
    <div class="slider">
      
      <div class="sky-day">
        <div class="sunbeam"></div>
        <div class="clouds-container">
          <div class="cloud cloud-1"></div>
          <div class="cloud cloud-2"></div>
        </div>
        <div class="bird"></div>
        <div class="bird bird-2"></div>
      </div>

      <div class="sky-night">
        <div class="aurora"></div>
        <div class="star star-1"></div>
        <div class="star star-2"></div>
        <div class="star star-3"></div>
        <div class="star star-4"></div>
        <div class="star star-5"></div>
        <div class="star star-6"></div>
        <div class="shooting-star"></div>
      </div>

      <div class="terrain terrain-day">
        <svg viewBox="0 0 200 45" preserveAspectRatio="none">
          <path d="M0,22 Q50,8 100,20 T200,12 L200,45 L0,45 Z" fill="#4ade80" opacity="0.6"/>
          <path d="M0,28 Q60,14 120,26 T200,18 L200,45 L0,45 Z" fill="#22c55e" opacity="0.85"/>
          <path d="M0,16 Q65,34 130,12 T200,22 L200,45 L0,45 Z" fill="#15803d"/>
          <circle cx="140" cy="12" r="3" fill="#166534"/>
          <circle cx="146" cy="14" r="2.5" fill="#166534"/>
          <circle cx="35" cy="22" r="2.5" fill="#166534"/>
        </svg>
      </div>

      <div class="terrain terrain-night">
        <svg viewBox="0 0 200 45" preserveAspectRatio="none">
          <path d="M0,22 L35,10 L75,26 L120,8 L165,24 L200,14 L200,45 L0,45 Z" fill="#334155"/>
          <path d="M0,28 L45,15 L90,30 L140,16 L180,28 L200,20 L200,45 L0,45 Z" fill="#1e293b"/>
          <path d="M0,36 Q50,30 100,34 T200,32 L200,45 L0,45 Z" fill="#0f172a" opacity="0.9"/>
        </svg>
      </div>

      <div class="knob">
        <div class="sun-icon"></div>
        <div class="moon-icon">
          <div class="crater crater-1"></div>
          <div class="crater crater-2"></div>
          <div class="crater crater-3"></div>
        </div>
      </div>

    </div>
  </label>

  <script>
    const interruptor = document.getElementById('interruptor');

    interruptor.addEventListener('change', () => {
      if (interruptor.checked) {
        document.body.classList.add('modo-noche');
      } else {
        document.body.classList.remove('modo-noche');
      }
    });
  </script>

</body>
</html>
